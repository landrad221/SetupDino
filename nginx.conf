server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;

    # Replaces: RewriteRule ^routes(?:/|$) - [F,L]
     location ^~ /routes {
        return 403;
    }

    # Replaces: RewriteCond %{REQUEST_FILENAME} !-f + RewriteRule ^ index.php [QSA,L]
    location / {
        try_files $uri /index.php?$query_string;
    }

    # Block direct access to .htaccess and other hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }


    location ~ \.php$ {
        fastcgi_pass setupdino:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    }
}